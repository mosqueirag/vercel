name: CI

on:
  pull_request:
    branches: [main, platform-coopsar-ai, data-internet-fibra, phase-3a-complaint-routing, phase-3b-commercial-inbox, phase-3c-geographic-coverage, phase-4a-admin-center, phase-4b-coopia-global, phase-4c-coopia-intelligence-ux, phase-4d-curated-knowledge, phase-4e-ai-editorial-curation, phase-4e2-curated-publishing, phase-4f1-coopia-intent-orchestrator, phase-4f2-coopia-continuous-interaction, phase-4g1-public-content-architecture, phase-4g2-internet-unified, phase-4g22-internet-commercial-experience, phase-4g23-internet-commercial-offer, phase-4g243-internet-plan-validation, phase-4g25-internet-commercial-sales, phase-4g26-internet-product-storytelling, phase-4g27-internet-commercial-demo, phase-4g28-internet-plan-cleanup-adsl, phase-4g3-sepelio-service-experience, phase-4g31-sepelio-family-update, phase-4g32-sepelio-private-documents, phase-4g33-admin-experience-reset, phase-4g41-home-dynamic-quick-actions, phase-4g42-adaptive-home-navigation]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  supabase-tests:
    name: supabase-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start disposable Supabase
        run: npx --yes supabase@2.114.0 start
      - name: Rebuild schema from migrations
        run: npx --yes supabase@2.114.0 db reset
      - name: Run pgTAP and RLS tests
        run: npx --yes supabase@2.114.0 test db
      - name: Lint database schema
        run: npx --yes supabase@2.114.0 db lint
      - name: Stop disposable Supabase
        if: always()
        run: npx --yes supabase@2.114.0 stop --no-backup
